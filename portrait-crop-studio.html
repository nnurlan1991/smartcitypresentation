<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Настройка портретов команды</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#150019;--panel:#24002c;--line:rgba(214,164,255,.25);--pink:#ff78d1;--violet:#b65cff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% 5%,#4c0d60 0,transparent 28%),var(--bg);color:#fff;font-family:"Golos Text",sans-serif}header{display:flex;align-items:end;justify-content:space-between;gap:20px;padding:30px max(24px,5vw);border-bottom:1px solid var(--line)}h1{margin:0;font-size:clamp(28px,4vw,54px);letter-spacing:-.065em;line-height:.95}header p{max-width:520px;margin:10px 0 0;color:#d9b4ee;font-size:14px;line-height:1.5}.toolbar{display:flex;gap:9px;flex-wrap:wrap}button{padding:11px 14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font:700 13px "Golos Text",sans-serif;cursor:pointer}button.primary{border-color:var(--pink);background:#7d1c78}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px;padding:36px max(24px,5vw)}.person{min-width:0;padding:16px;border:1px solid var(--line);background:rgba(34,0,43,.72);box-shadow:0 20px 45px #0004}.portrait{position:relative;aspect-ratio:1;overflow:hidden;border:2px solid rgba(214,164,255,.8);border-radius:32px;background:#100014}.portrait:after{content:"";position:absolute;inset:16%;border:1px dashed rgba(255,255,255,.42);border-radius:50%;pointer-events:none}.portrait img{width:100%;height:100%;object-fit:cover;transform-origin:center;will-change:transform;filter:contrast(1.05)}h2{margin:17px 0 12px;font-size:18px}.upload{display:flex;align-items:center;justify-content:center;min-height:38px;margin-top:10px;border:1px dashed rgba(214,164,255,.55);color:#e7c8f5;font-size:12px;font-weight:700;cursor:pointer}.upload:hover{border-color:var(--pink);color:#fff}.upload input{display:none}.upload small{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.control{margin-top:12px}.control label{display:flex;justify-content:space-between;color:#dec3ec;font-size:12px;font-weight:700}.control output{color:var(--pink)}input[type=range]{width:100%;accent-color:var(--pink)}.note{padding:0 max(24px,5vw) 35px;color:rgba(255,255,255,.68);font-size:13px}@media(max-width:800px){header{align-items:flex-start;flex-direction:column}main{grid-template-columns:1fr;max-width:480px;margin:auto}}
  </style>
</head>
<body>
  <header><div><h1>Кадрирование портретов</h1><p>Пунктирный круг — контрольный размер лица. Настройте каждый кадр так, чтобы лица занимали примерно одинаковую площадь, затем скачайте JSON.</p></div><div class="toolbar"><button id="reset">Сбросить</button><button class="primary" id="export">Скачать JSON</button></div></header>
  <main id="studio"></main><p class="note">После настройки пришлите файл <code>team-portrait-crops.json</code> — я встрою эти значения в лендинг.</p>
  <script>
    const people=[['Нұрлан Нұрсұлтан','assets/team-1.jpg',1.08,50,25],['Купжанов Алмас','assets/team-2.jpg',1.22,50,24],['Такабаева Айгерим','assets/team-3.jpg',1.16,50,26]];
    const key='portrait-crop-studio-v1',saved=JSON.parse(localStorage.getItem(key)||'{}'),studio=document.querySelector('#studio'),uploads={};
    const values=(i,defaults)=>saved[i]||{zoom:defaults[0],x:defaults[1],y:defaults[2]};
    const draw=()=>{studio.innerHTML='';people.forEach(([name,src,...defaults],i)=>{const v=values(i,defaults),card=document.createElement('article');card.className='person';card.dataset.id=i;card.innerHTML=`<div class="portrait"><img src="${uploads[i]?.url||src}" alt="${name}"></div><h2>${name}</h2><label class="upload">Загрузить другое фото<input type="file" accept="image/*"><small>${uploads[i]?.name||'Используется исходное фото'}</small></label>${[['zoom','Масштаб',.8,1.6,.01],['x','Горизонталь',30,70,1],['y','Вертикаль',15,45,1]].map(([id,label,min,max,step])=>`<div class="control"><label>${label}<output>${v[id]}</output></label><input data-key="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${v[id]}"></div>`).join('')}`;studio.append(card);update(card);});};
    const update=card=>{const id=card.dataset.id,v={};card.querySelectorAll('input[data-key]').forEach(input=>v[input.dataset.key]=Number(input.value));saved[id]=v;localStorage.setItem(key,JSON.stringify(saved));const img=card.querySelector('img');img.style.objectPosition=`${v.x}% ${v.y}%`;img.style.transform=`scale(${v.zoom})`;card.querySelectorAll('output').forEach(output=>output.textContent=v[output.closest('.control').querySelector('input').dataset.key]);};
    studio.addEventListener('input',event=>{const card=event.target.closest('.person');if(card)update(card)});studio.addEventListener('change',event=>{const input=event.target;if(input.type!=='file'||!input.files?.[0])return;const card=input.closest('.person'),id=card.dataset.id,file=input.files[0];if(uploads[id]?.url)URL.revokeObjectURL(uploads[id].url);uploads[id]={name:file.name,url:URL.createObjectURL(file)};saved[id]={zoom:1,x:50,y:28};localStorage.setItem(key,JSON.stringify(saved));card.querySelector('.portrait img').src=uploads[id].url;card.querySelector('.upload small').textContent=file.name;card.querySelectorAll('input[data-key]').forEach(input=>input.value=saved[id][input.dataset.key]);update(card)});document.querySelector('#reset').onclick=()=>{localStorage.removeItem(key);location.reload()};document.querySelector('#export').onclick=()=>{const out=people.map(([name,src,...defaults],i)=>({name,photo:uploads[i]?.name||src,...values(i,defaults)}));const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:'team-portrait-crops.json'});a.click();URL.revokeObjectURL(a.href)};draw();
  </script>
</body>
</html>
